    return text;
  };

  const norm = (value) => {
    const hex = String(value || '').replace(/[^0-9a-fA-F]/g, '').toUpperCase();
    return hex.length === 12 ? hex.match(/.{2}/g).join(':') : null;
  };
  const macsOf = (d) => [...new Set((Array.isArray(d && d.macs) ? d.macs : [d && d.mac]).map(norm).filter(Boolean))];
  const homeName = (text) => String(text || '').replace(/[^\p{L}\p{N} ']/gu, ' ').replace(/\s+/g, ' ').replace(/^[ ']+|[ ']+$/g, '');
  const newId = () => 's' + Math.random().toString(36).slice(2, 8);

  // ------------------------------------------------------------- data helpers

  function routerDevice(mac) {
    return router ? router.devices.find((d) => d.macs.includes(mac)) : null;
  }
  function routerRule(mac) {
    return router ? router.rules.find((r) => r.macs.includes(mac)) : null;
  }
  function routerName(macs) {
    for (const mac of macs) { const d = routerDevice(mac); if (d && d.name) return d.name; }
    return '';
  }
  function isOnline(macs) {
    return macs.some((mac) => { const d = routerDevice(mac); return d && d.online; });
  }

  /** Devices that will be in Apple Home: the ones in the settings, plus the ones the plugin adds from the router's rules. */
  function chosen() {
    const list = [];
    const claimed = new Set();
    for (const d of Array.isArray(cfg.devices) ? cfg.devices : []) {
      const macs = macsOf(d).filter((m) => !claimed.has(m));
      if (!macs.length) continue;
      macs.forEach((m) => claimed.add(m));
      list.push({ device: d, macs, auto: false });
    }
    if (cfg.autoDiscover !== false && router) {
      const hidden = new Set((cfg.exclude || []).map(norm));
      for (const rule of router.rules) {
        const macs = rule.macs.filter((m) => !claimed.has(m) && !hidden.has(m));
        if (!macs.length) continue;
        macs.forEach((m) => claimed.add(m));
        list.push({ device: { macs }, macs, auto: true });
      }
    }
    return list;
  }

  function own(item) {
    if (!item.auto) return item.device;
    const device = { name: homeName(routerName(item.macs)) || item.macs[0], macs: item.macs.slice() };
    cfg.devices = (Array.isArray(cfg.devices) ? cfg.devices : []).concat([device]);
    item.device = device;
    item.auto = false;
    return device;
  }

  function flag(device, key, globalKey) {
    if (typeof device[key] === 'boolean') return device[key];
    return typeof cfg[globalKey] === 'boolean' ? cfg[globalKey] : true;
  }

  let pushTimer = null;
  function push() {
    clearTimeout(pushTimer);
    pushTimer = setTimeout(() => {
      const out = cfg;
      out.platform = 'LinksysVelop';
      if (!out.name) out.name = 'Linksys Velop';
      if (typeof out.host === 'string') out.host = out.host.trim();
      for (const key of ['devices', 'exclude']) if (Array.isArray(out[key]) && !out[key].length) delete out[key];
      if (out.labels) {
        for (const [k, v] of Object.entries(out.labels)) if (!String(v || '').trim()) delete out.labels[k];
        if (!Object.keys(out.labels).length) delete out.labels;
      }
      for (const d of out.devices || []) if (Array.isArray(d.schedules) && !d.schedules.length) delete d.schedules;
      hb.updatePluginConfig([out]);
    }, 120);
  }

  // ------------------------------------------------------------------ render

  const check = (id, label, checked, attrs) => `
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="${id}" ${checked ? 'checked' : ''} ${attrs}>
      <label class="form-check-label" for="${id}">${esc(label)}</label>
    </div>`;
  const timeSelect = (value, attrs) => `
    <select class="form-select lv-ltr" ${attrs}>${TIMES.map((x) => `<option ${x === value ? 'selected' : ''}>${x}</option>`).join('')}</select>`;
  const chevron = '<svg class="lv-chev" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function renderSchedule(s, i, k) {
    const days = Array.isArray(s.days) && s.days.length ? s.days : DAYS;
    const same = s.start && s.start === s.end;
    return `
      <div class="lv-sched">
        <div class="lv-row">
          <input class="form-control lv-grow" type="text" placeholder="${esc(t('schedName'))}" value="${esc(s.name)}" data-in="sched-name" data-i="${i}" data-k="${k}">
          <button type="button" class="lv-x" aria-label="remove" data-act="sched-remove" data-i="${i}" data-k="${k}">&times;</button>
        </div>
        <div class="lv-row" style="margin-top:.5rem">
          <div class="lv-grow"><label class="lv-label" style="margin-top:0">${esc(t('from'))}</label>${timeSelect(s.start, `data-ch="sched-start" data-i="${i}" data-k="${k}"`)}</div>
          <div class="lv-grow"><label class="lv-label" style="margin-top:0">${esc(t('until'))}</label>${timeSelect(s.end, `data-ch="sched-end" data-i="${i}" data-k="${k}"`)}</div>
        </div>
        ${same ? `<div class="lv-err">${esc(t('sameTime'))}</div>` : ''}
        <div class="lv-days">
          ${DAYS.map((d, n) => `<button type="button" class="lv-day ${days.includes(d) ? 'btn btn-primary' : 'off'}" aria-pressed="${days.includes(d)}" data-act="sched-day" data-i="${i}" data-k="${k}" data-day="${d}">${esc(t('days')[n])}</button>`).join('')}
        </div>
      </div>`;
  }

  /** "10.0.0.5 [fixed IP] · AA:BB:.." - the address, whether the router keeps it fixed, and the MAC addresses. */
  function addressLine(d, macs, short) {
    const parts = [];
    if (d && (d.ip || d.fixedIp)) {
      let tag = '';
      if (router && router.dhcp) {
        const moved = d.fixedIp && d.ip && d.fixedIp !== d.ip ? ` ${d.fixedIp}` : '';
        const dir = lang === 'he' ? 'rtl' : 'ltr';
        tag = d.fixedIp ? `<span class="lv-ip fixed" dir="${dir}">${esc(t('ipFixed') + moved)}</span>` : `<span class="lv-ip" dir="${dir}">${esc(t('ipDynamic'))}</span>`;
      }
      parts.push(`${esc(d.ip || d.fixedIp)} ${tag}`);
      if (short) return parts[0]; // the header of a card is narrow: the MAC addresses are inside the card
    }
    parts.push(esc((macs || (d && d.macs) || []).join(', ')));
    return parts.join(' · ');
  }

  /** The address line of a row in rename mode, with the button that makes the address fixed or releases it. */
  function fixBlock(d) {
    const can = router && router.dhcp && router.dhcp.enabled && (d.fixedIp || d.ip);
    const button = !can ? '' : `<button type="button" class="btn btn-sm ${d.fixedIp ? 'btn-secondary' : 'btn-primary'} lv-fix" data-act="fix" data-mac="${esc(d.macs[0])}" ${d.busy ? 'disabled' : ''}>${esc(t(d.fixedIp ? 'release' : 'makeFixed'))}</button>`;
    return `<div class="lv-sub lv-ltr" style="margin-top:.25rem">${addressLine(d)}</div>${button}`;
  }

  function renderChosen(item, i) {
    const d = item.device;
    const name = d.name || routerName(item.macs) || item.macs[0];
    const open = view.open === item.macs[0];
    const online = isOnline(item.macs);
    const head = `
      <button type="button" class="lv-head" data-act="open" data-i="${i}">
        <span class="lv-dot ${online ? 'on' : ''}" title="${esc(t(online ? 'online' : 'offline'))}"></span>
        <span class="lv-grow">
          <div class="lv-name">${esc(name)}</div>
          <div class="lv-sub lv-ltr">${addressLine(item.macs.map(routerDevice).find(Boolean), item.macs, true)}</div>
        </span>
        ${item.auto ? `<span class="lv-tag">${esc(t('auto'))}</span>` : ''}
        ${chevron}
      </button>`;
    if (!open) return `<div class="lv-box">${head}</div>`;

    const schedules = Array.isArray(d.schedules) ? d.schedules : [];
    return `
      <div class="lv-box lv-open">${head}
        <div class="lv-body">
          <label class="lv-label">${esc(t('name'))}</label>
          <input class="form-control" type="text" value="${esc(item.auto ? homeName(name) : d.name)}" data-in="name" data-i="${i}">
          <div class="lv-checks">
            ${check(`lv-p${i}`, t('pause'), flag(d, 'pauseSwitch', 'pauseSwitches'), `data-ch="flag" data-key="pauseSwitch" data-i="${i}"`)}
            ${check(`lv-s${i}`, t('schedSwitch'), flag(d, 'scheduleSwitch', 'scheduleSwitches'), `data-ch="flag" data-key="scheduleSwitch" data-i="${i}"`)}
            ${check(`lv-c${i}`, t('sensor'), flag(d, 'presenceSensor', 'presenceSensors'), `data-ch="flag" data-key="presenceSensor" data-i="${i}"`)}
          </div>
          <label class="lv-label" style="margin-top:1rem">${esc(t('schedules'))}</label>
          <p class="lv-hint">${esc(t(schedules.length ? 'schedHint' : 'noSchedules'))}</p>
          ${schedules.map((s, k) => renderSchedule(s, i, k)).join('')}
          <button type="button" class="btn btn-sm btn-primary" style="margin-top:.6rem" data-act="sched-add" data-i="${i}">+ ${esc(t('addSchedule'))}</button>
          <label class="lv-label" style="margin-top:1rem">${esc(t('macs'))}</label>
          <input class="form-control lv-ltr" type="text" autocapitalize="characters" autocomplete="off" spellcheck="false" value="${esc(item.macs.join(', '))}" data-in="macs" data-i="${i}">
          <p class="lv-hint" style="margin-top:.3rem">${esc(t('macsHint'))}</p>
          <button type="button" class="btn btn-sm btn-danger" data-act="remove" data-i="${i}">${esc(t('remove'))}</button>
        </div>
      </div>`;
  }

  function renderNetwork(taken) {
    if (!router) return '';
    const query = view.search.trim().toLowerCase();
    const list = router.devices
      .filter((d) => (query ? `${d.name} ${d.hostname} ${d.ip} ${d.macs.join(' ')}`.toLowerCase().includes(query) : (!view.onlyOnline || d.online)))
      .sort((a, b) => (b.online - a.online) || (a.name || '~').localeCompare(b.name || '~', lang));
    const shown = list.slice(0, view.limit);
    // Every device is listed. A tick means it is in Apple Home: ticking adds it, unticking removes it.
    const pickRow = (d) => {
      const inHome = d.macs.some((m) => taken.has(m));
      return `
          <label class="lv-pick">
            <input class="form-check-input" type="checkbox" data-ch="pick" data-mac="${esc(d.macs[0])}" ${inHome ? 'checked' : ''}>
            <span class="lv-dot ${d.online ? 'on' : ''}"></span>
            <span class="lv-grow">
              <div class="lv-name">${esc(d.name || d.macs[0])}</div>
              <div class="lv-sub lv-ltr">${addressLine(d)}</div>
            </span>
            ${inHome ? `<span class="lv-tag">${esc(t('inHomeTag'))}</span>` : ''}
          </label>`;
    };
    const editRow = (d) => `
          <div class="lv-edit">
            <span class="lv-dot ${d.online ? 'on' : ''}"></span>
            <span class="lv-grow">
              <input class="form-control" type="text" maxlength="64" enterkeyhint="next" autocomplete="off" autocapitalize="sentences"
                placeholder="${esc(d.hostname || d.macs[0])}" value="${esc(d.name === d.hostname ? '' : d.name)}" aria-label="${esc(d.hostname || d.macs[0])}"
                ${d.id ? '' : 'disabled'} data-ch="rename" data-mac="${esc(d.macs[0])}">
              <div data-fix="${esc(d.macs[0])}">${fixBlock(d)}</div>
              <div class="lv-note" data-status="${esc(d.macs[0])}"></div>
            </span>
          </div>`;
    return `
      <h5>${esc(t(view.rename ? 'renameTitle' : 'network'))}</h5>
      <p class="lv-hint">${esc(t(view.rename ? 'renameHint' : 'networkHint'))}${view.rename && router.dhcp && router.dhcp.enabled ? ` ${esc(t('fixedHint'))}` : ''}</p>
      <input class="form-control" type="search" placeholder="${esc(t('search'))}" value="${esc(view.search)}" data-in="search">
      <div class="form-check form-switch" style="margin:.6rem 0 .3rem">
        <input class="form-check-input" type="checkbox" id="lv-online" ${view.onlyOnline ? 'checked' : ''} data-ch="only-online">
        <label class="form-check-label" for="lv-online">${esc(t('onlyOnline'))}</label>
      </div>
      <div class="form-check form-switch" style="margin:.3rem 0 .6rem">
        <input class="form-check-input" type="checkbox" id="lv-rename" ${view.rename ? 'checked' : ''} data-ch="rename-mode">
        <label class="form-check-label" for="lv-rename">${esc(t('renameMode'))}</label>
      </div>
      <div id="lv-net-wrap">
      ${list.length > shown.length ? `<p class="lv-hint" id="lv-showing" style="margin:.2rem 0 .4rem">${esc(t('showing', { shown: shown.length, total: list.length }))}</p>` : ''}
      <div class="lv-box" id="lv-net" style="padding:.2rem .7rem">
        ${shown.length ? shown.map(view.rename ? editRow : pickRow).join('') : `<p class="lv-hint" style="margin:.6rem 0">${esc(t('nothing'))}</p>`}
      </div>
      ${list.length > shown.length ? `<button type="button" class="btn btn-sm btn-secondary" data-act="more">${esc(t('more', { n: Math.min(PAGE, list.length - shown.length) }))}</button>` : ''}
      </div>`;
  }

  /** Bring the fixed-address list, and the label on every device, in line with what the router stored. */
  function applyReservations(list) {
    router.reservations = list;
    if (router.dhcp) router.dhcp.reservations = list.length;
    const byMac = new Map(list.map((r) => [r.mac, r.ip]));
    for (const d of router.devices) d.fixedIp = d.macs.map((m) => byMac.get(m)).find(Boolean) || '';
  }

  /** Every fixed address on the router, the ones without a connected device first. */
  function fixedRows() {
    if (!router || !router.dhcp) return [];
    const rank = { unknown: 0, offline: 1, online: 2 };
    return (router.reservations || []).map((r) => {
      const d = routerDevice(r.mac);
      return { ...r, name: (d && d.name) || r.label || r.mac, state: d ? (d.online ? 'online' : 'offline') : 'unknown' };
    }).sort((a, b) => (rank[a.state] - rank[b.state]) || a.name.localeCompare(b.name, lang));
  }

  function renderFixed() {
    if (!router || !router.dhcp) return '';
    const rows = fixedRows();
    const fixedRow = (r) => `
            <div class="lv-edit">
              <span class="lv-dot ${r.state === 'online' ? 'on' : ''}"></span>
              <span class="lv-grow">
                <div class="lv-name">${esc(r.name)}</div>
                <div class="lv-sub lv-ltr">${esc(`${r.ip} · ${r.mac}`)}</div>
                ${r.state === 'unknown' ? `<div class="lv-note">${esc(t('unknownDevice'))}</div>` : ''}
              </span>
              <button type="button" class="btn btn-sm btn-secondary" data-act="fixed-release" data-mac="${esc(r.mac)}" ${fixedBox.busy ? 'disabled' : ''}>${esc(t('release'))}</button>
            </div>`;
    const stale = rows.filter((r) => r.state !== 'online');
    const connected = rows.filter((r) => r.state === 'online');
    const body = !view.fixed ? '' : `<div class="lv-body">
        <p class="lv-hint" style="margin-top:.7rem">${esc(t(rows.length ? 'fixedListHint' : 'fixedNone'))}</p>
        ${!rows.length ? '' : `
          ${stale.length ? '' : `<p class="lv-hint" id="lv-fixed-none">${esc(t('noStale'))}</p>`}
          ${!stale.length && !fixedBox.all ? '' : `<div class="lv-scroll" id="lv-fixed-list">
            ${stale.length ? `<div class="lv-group">${esc(t('groupOffline', { n: stale.length }))}</div>${stale.map(fixedRow).join('')}` : ''}
            ${fixedBox.all && connected.length ? `<div class="lv-group">${esc(t('groupOnline', { n: connected.length }))}</div>${connected.map(fixedRow).join('')}` : ''}
          </div>`}
          ${connected.length ? `<div style="margin-bottom:.6rem"><button type="button" class="btn btn-sm btn-secondary" data-act="fixed-all">${esc(fixedBox.all ? t('hideConnected') : t('showConnected', { n: connected.length }))}</button></div>` : ''}`}
        ${stale.length ? `<button type="button" class="btn btn-danger" data-act="fixed-stale" ${fixedBox.busy ? 'disabled' : ''}>${esc(t(fixedBox.confirm ? 'releaseConfirm' : 'releaseStale', { n: stale.length }))}</button>` : ''}
        ${fixedBox.note ? `<div class="lv-note lv-ok" style="margin-top:.5rem">${esc(fixedBox.note)}</div>` : ''}
        ${fixedBox.error ? `<div class="lv-err">${esc(fixedBox.error)}</div>` : ''}
      </div>`;
    return `
      <div class="lv-box ${view.fixed ? 'lv-open' : ''}" id="lv-fixed" style="margin-top:1.4rem">
        <button type="button" class="lv-head" data-act="fixed-open">
          <span class="lv-grow lv-name">${esc(t('fixedTitle'))}</span>
          <span class="lv-tag">${rows.length}</span>
          ${chevron}
        </button>${body}
      </div>`;
  }

  /** Release fixed addresses by MAC. One request, so the router rewrites its table once. */
  async function releaseFixed(macs) {
    if (!macs.length || fixedBox.busy) return;
    Object.assign(fixedBox, { busy: true, confirm: false, note: t('saving'), error: '' });
    render();
    try {
      const result = await hb.request('/fixed-ip', {
        host: cfg.host, port: cfg.port, username: cfg.username, password: cfg.password,
        changes: macs.map((mac) => ({ mac, reserve: false })),
      });
      applyReservations(result.reservations);
      fixedBox.note = `${t('saved')} ✓${(result.sideEffects || []).length ? ` ${t('applying')}` : ''}`;
    } catch (e) {
      fixedBox.note = '';
      fixedBox.error = (e && (e.message || (e.error && e.error.message))) || String(e);
    }
    fixedBox.busy = false;
    render();
  }

  /** Old devices the router can forget: not connected, and not used for anything. */
  function staleDevices(taken) {
    if (!router) return [];
    return router.devices
      .filter((d) => d.id && !d.online && !d.fixedIp && !d.macs.some((m) => routerRule(m) || taken.has(m)))
      .sort((a, b) => (a.custom - b.custom) || (a.name || '~').localeCompare(b.name || '~', lang));
  }
  const cleanPicked = (list) => list.filter((d) => (clean.picked ? clean.picked.has(d.id) : !d.custom));

  function renderClean(taken) {
    if (!router) return '';
    const list = staleDevices(taken);
    const picked = cleanPicked(list);
    const ids = new Set(picked.map((d) => d.id));
    const body = !view.clean ? '' : `<div class="lv-body">
        <p class="lv-hint" style="margin-top:.7rem">${esc(list.length ? t('cleanCount', { n: list.length }) : t('cleanNone'))} ${esc(t('cleanHint'))}</p>
        ${!list.length ? '' : `
          <div class="lv-row">
            <button type="button" class="btn btn-sm btn-secondary" data-act="clean-all" ${clean.busy ? 'disabled' : ''}>${esc(t('selectAll'))}</button>
            <button type="button" class="btn btn-sm btn-secondary" data-act="clean-none" ${clean.busy ? 'disabled' : ''}>${esc(t('selectNone'))}</button>
          </div>
          <div class="lv-scroll" id="lv-clean-list">
            ${list.map((d) => `
              <label class="lv-pick">
                <input class="form-check-input" type="checkbox" data-ch="clean-pick" data-id="${esc(d.id)}" ${ids.has(d.id) ? 'checked' : ''} ${clean.busy ? 'disabled' : ''}>
                <span class="lv-grow">
                  <div class="lv-name">${esc(d.name || d.macs[0])}</div>
                  <div class="lv-sub lv-ltr">${esc(d.macs.join(', '))}</div>
                </span>
                ${d.custom ? `<span class="lv-tag">${esc(t('customName'))}</span>` : ''}
              </label>`).join('')}
          </div>
          <button type="button" class="btn btn-danger" data-act="clean-run" ${clean.busy || !picked.length ? 'disabled' : ''}>${esc(t(clean.confirm ? 'cleanConfirm' : 'cleanButton', { n: picked.length }))}</button>`}
        ${clean.message ? `<div class="lv-note lv-ok" id="lv-clean-msg" style="margin-top:.5rem">${esc(clean.message)}</div>` : ''}
        ${clean.error ? `<div class="lv-err" id="lv-clean-err">${esc(clean.error)}</div>` : ''}
      </div>`;
    return `
      <div class="lv-box ${view.clean ? 'lv-open' : ''}" id="lv-clean" style="margin-top:1.4rem">
        <button type="button" class="lv-head" data-act="clean-open">
          <span class="lv-grow lv-name">${esc(t('cleanTitle'))}</span>
          ${list.length ? `<span class="lv-tag">${list.length}</span>` : ''}
          ${chevron}
        </button>${body}
      </div>`;
  }

  /** Remove the ticked devices from the router, a few at a time so progress can be shown. */
  async function runClean() {
    const taken = new Set(current.flatMap((item) => item.macs));
    const targets = cleanPicked(staleDevices(taken)).map((d) => d.id);
    if (!targets.length || clean.busy) return;
    Object.assign(clean, { busy: true, confirm: false, error: '', message: t('cleanProgress', { done: 0, n: targets.length }) });
    render();
    let done = 0;
    const failed = [];
    try {
      for (let i = 0; i < targets.length; i += 20) {
        const result = await hb.request('/forget', {
          host: cfg.host, port: cfg.port, username: cfg.username, password: cfg.password,
          ids: targets.slice(i, i + 20), keep: [...taken],
        });
        done += result.removed.length;
        failed.push(...result.failed);
        const gone = new Set(result.removed);
        router.devices = router.devices.filter((d) => !gone.has(d.id));
        clean.message = t('cleanProgress', { done, n: targets.length });
        const el = root.querySelector('#lv-clean-msg');
        if (el) el.textContent = clean.message;
      }
      clean.message = t('cleanDone', { done });
      if (failed.length) clean.error = t('cleanFailed', { n: failed.length, msg: [...new Set(failed.map((f) => f.reason))].join(', ') });
    } catch (e) {
      clean.message = done ? t('cleanDone', { done }) : '';
      clean.error = (e && (e.message || (e.error && e.error.message))) || String(e);
    }
    clean.busy = false;
    clean.picked = null;
    render();
  }

  function renderOptions() {
    const labels = cfg.labels || {};
    const select = (key, value, options) => `<select class="form-select" data-ch="opt" data-key="${key}">${options.map(([v, text]) => `<option value="${v}" ${v === value ? 'selected' : ''}>${esc(text)}</option>`).join('')}</select>`;
    const labelInput = (key) => `<div class="lv-grow"><input class="form-control" type="text" placeholder="${esc(t('label' + key[0].toUpperCase() + key.slice(1)))}" value="${esc(labels[key])}" data-in="label" data-key="${key}"></div>`;
    return `
      <div class="lv-box ${view.options ? 'lv-open' : ''}" style="margin-top:1.4rem">
        <button type="button" class="lv-head" data-act="options"><span class="lv-grow lv-name">${esc(t('options'))}</span>${chevron}</button>
        ${!view.options ? '' : `<div class="lv-body">
          <div style="margin-top:.7rem">${check('lv-auto', t('autoDiscover'), cfg.autoDiscover !== false, 'data-ch="opt-bool" data-key="autoDiscover"')}</div>
          <div style="margin-top:.5rem">${check('lv-reboot', t('reboot'), cfg.rebootSwitch === true, 'data-ch="opt-bool" data-key="rebootSwitch"')}</div>
          <p class="lv-hint">${esc(t('rebootHint'))}</p>
          <label class="lv-label">${esc(t('direction'))}</label>
          ${select('pauseSwitchMode', cfg.pauseSwitchMode === 'internet' ? 'internet' : 'pause', [['pause', t('dirPause')], ['internet', t('dirInternet')]])}
          <label class="lv-label">${esc(t('sensorType'))}</label>
          ${select('presenceSensorType', cfg.presenceSensorType || 'occupancy', [['occupancy', t('occupancy')], ['motion', t('motion')], ['contact', t('contact')]])}
          <label class="lv-label">${esc(t('defaults'))}</label>
          <div class="lv-row">
            <div class="lv-grow"><label class="lv-label" style="margin-top:0">${esc(t('from'))}</label>${timeSelect(cfg.defaultPauseStart || '22:00', 'data-ch="opt" data-key="defaultPauseStart"')}</div>
            <div class="lv-grow"><label class="lv-label" style="margin-top:0">${esc(t('until'))}</label>${timeSelect(cfg.defaultPauseEnd || '06:00', 'data-ch="opt" data-key="defaultPauseEnd"')}</div>
          </div>
          <label class="lv-label">${esc(t('labels'))}</label>
          <div class="lv-row">${labelInput('pause')}${labelInput('schedule')}</div>
          <div class="lv-row" style="margin-top:.5rem">${labelInput('connected')}${labelInput('restart')}</div>
          <label class="lv-label">${esc(t('poll'))}</label>
          <input class="form-control lv-ltr" type="number" inputmode="numeric" min="5" max="3600" value="${esc(cfg.pollInterval || 15)}" data-in="opt-num" data-key="pollInterval">
          <label class="lv-label">${esc(t('offlineDelay'))}</label>
          <input class="form-control lv-ltr" type="number" inputmode="numeric" min="0" value="${esc(cfg.offlineDelay || 0)}" data-in="opt-num" data-key="offlineDelay">
          <div style="margin-top:.8rem">${check('lv-flags', t('appFlags'), cfg.syncAppFlags !== false, 'data-ch="opt-bool" data-key="syncAppFlags"')}</div>
        </div>`}
      </div>`;
  }

  function render() {
    current = chosen();
    const taken = new Set(current.flatMap((item) => item.macs));
    const online = router ? router.devices.filter((d) => d.online).length : 0;
    const button = t(router ? 'refresh' : 'connect');
    const status = busy ? t('loading')
      : router ? t('statusOk', { online, total: router.devices.length, rules: router.rules.length, max: router.maxRules || '?' })
        : t('needLogin', { button });
    root.setAttribute('dir', lang === 'he' ? 'rtl' : 'ltr');
    root.innerHTML = `
      <div class="lv-row" style="margin-bottom:.6rem">
        <span class="lv-grow lv-hint" style="margin:0">${esc(t('testedOn'))}</span>
        <label class="lv-hint" style="margin:0" for="lv-lang">${esc(t('language'))}</label>
        <select class="form-select" id="lv-lang" style="width:auto" data-ch="language">
          <option value="en" ${lang === 'en' ? 'selected' : ''}>English</option>
          <option value="he" ${lang === 'he' ? 'selected' : ''}>עברית</option>
        </select>
      </div>
      <div class="lv-box">
        <label class="lv-label" style="margin-top:0" for="lv-host">${esc(t('host'))}</label>
        <input class="form-control lv-ltr" id="lv-host" type="text" inputmode="decimal" autocomplete="off" placeholder="192.168.1.1" value="${esc(cfg.host)}" data-in="host">
        <p class="lv-hint" style="margin:.3rem 0 0">${esc(t('hostHint'))}</p>
        <label class="lv-label" for="lv-pass">${esc(t('password'))}</label>
        <input class="form-control lv-ltr" id="lv-pass" type="password" autocomplete="off" value="${esc(cfg.password)}" data-in="password">
        <p class="lv-hint" style="margin:.3rem 0 .7rem">${esc(t('passwordHint'))}</p>
        <button type="button" class="btn btn-primary" data-act="connect" ${busy ? 'disabled' : ''}>${esc(button)}</button>
        ${error ? `<div class="lv-err">${esc(error)}</div>` : `<div class="lv-status lv-hint" style="margin-bottom:0">${esc(status)}</div>`}
      </div>

      <h5>${esc(t('inHome'))}</h5>
      <label class="lv-label" style="margin-top:.3rem" for="lv-layout">${esc(t('layout'))}</label>
      <select class="form-select" id="lv-layout" data-ch="layout">
        <option value="device" ${cfg.grouping === 'single' ? '' : 'selected'}>${esc(t('layoutDevice'))}</option>
        <option value="single" ${cfg.grouping === 'single' ? 'selected' : ''}>${esc(t('layoutSingle'))}</option>
      </select>
      ${cfg.grouping !== 'single' ? '' : `
        <p class="lv-hint" style="margin:.4rem 0 0">${esc(t('layoutHint'))}</p>
        <label class="lv-label" for="lv-group">${esc(t('groupName'))}</label>
        <input class="form-control" id="lv-group" type="text" placeholder="${esc(cfg.name || 'Linksys Velop')}" value="${esc(cfg.groupName)}" data-in="group-name">`}
      <p class="lv-hint" style="margin-top:.8rem">${esc(t(current.length ? 'inHomeHint' : 'none'))}</p>
      <div id="lv-chosen">${current.map(renderChosen).join('')}</div>

      ${renderNetwork(taken)}
      ${renderFixed()}
      ${renderClean(taken)}
      ${renderOptions()}
      <p class="lv-hint" style="margin-top:1rem">${esc(t('saveNote'))}</p>`;
  }

  // ------------------------------------------------------------------ actions

  async function connect() {
    if (busy) return;
    busy = true; error = ''; render();
    try {
      if (hb.showSpinner) hb.showSpinner();
      router = await hb.request('/devices', { host: cfg.host, port: cfg.port, username: cfg.username, password: cfg.password });
    } catch (e) {
      router = null;
      error = (e && (e.message || (e.error && e.error.message))) || String(e);
    } finally {
      if (hb.hideSpinner) hb.hideSpinner();
      busy = false;
      render();
    }
  }

  /** Save a new name on the router. The row is updated in place so the keyboard and the scroll position stay put. */
  async function rename(input) {
    const d = routerDevice(input.dataset.mac);
    const status = root.querySelector(`[data-status="${input.dataset.mac}"]`);
    if (!d || !d.id) return;
    const name = input.value.replace(/\s+/g, ' ').trim();
    if (name === (d.name === d.hostname ? '' : d.name)) return; // nothing changed
    const show = (text, cls) => { if (status) { status.textContent = text; status.className = `lv-note ${cls}`; } };
    show(t('saving'), '');
    try {
      await hb.request('/rename', { host: cfg.host, port: cfg.port, username: cfg.username, password: cfg.password, id: d.id, name });
      d.name = name || d.hostname;
      show(`${t('saved')} ✓`, 'lv-ok');
    } catch (e) {
      show(t('renameFail', { msg: (e && (e.message || (e.error && e.error.message))) || String(e) }), 'lv-err');
    }
  }

  // Fixed IP addresses. Taps made close together are sent to the router as one change,
  // because the router rewrites its whole address table every time.
  const fixQueue = new Map();
  let fixTimer = null;
  let fixChain = Promise.resolve();
  const note = (mac, text, cls) => {
    const el = root.querySelector(`[data-status="${mac}"]`);
    if (el) { el.textContent = text; el.className = `lv-note ${cls}`; }
  };
  const redrawFix = (d) => {
    const el = root.querySelector(`[data-fix="${d.macs[0]}"]`);
    if (el) el.innerHTML = fixBlock(d);
  };

  function toggleFixed(mac) {
    const d = routerDevice(mac);
    if (!d || d.busy) return;
    const reserve = !d.fixedIp;
    if (reserve && !d.ip) return;
    fixQueue.set(d.macs[0], { device: d, reserve });
    d.busy = true;
    redrawFix(d);
    note(d.macs[0], t('saving'), '');
    clearTimeout(fixTimer);
    fixTimer = setTimeout(() => { fixChain = fixChain.then(sendFixed); }, 1200);
  }

  async function sendFixed() {
    const batch = [...fixQueue.values()];
    fixQueue.clear();
    if (!batch.length) return;
    const changes = [];
    for (const { device: d, reserve } of batch) {
      if (reserve) changes.push({ mac: d.ipMac || d.macs[0], reserve: true, ip: d.ip, name: d.hostname || d.name });
      else d.macs.forEach((m) => changes.push({ mac: m, reserve: false }));
    }
    let failure = '';
    let disturbed = false;
    try {
      const result = await hb.request('/fixed-ip', { host: cfg.host, port: cfg.port, username: cfg.username, password: cfg.password, changes });
      applyReservations(result.reservations);
      disturbed = (result.sideEffects || []).length > 0;
    } catch (e) {
      failure = (e && (e.message || (e.error && e.error.message))) || String(e);
    }
    for (const { device: d } of batch) {
      d.busy = false;
      redrawFix(d);
      if (failure) note(d.macs[0], t('renameFail', { msg: failure }), 'lv-err');
      else note(d.macs[0], `${t('saved')} ✓${disturbed ? ` ${t('applying')}` : ''}`, 'lv-ok');
    }
  }

  function removeItem(item) {
    cfg.devices = (cfg.devices || []).filter((d) => d !== item.device);
    // A device that has a rule on the router would be added again automatically, so hide it.
    const ruled = item.macs.filter((m) => routerRule(m));
    if (ruled.length && cfg.autoDiscover !== false) cfg.exclude = [...new Set([...(cfg.exclude || []).map(norm).filter(Boolean), ...ruled])];
    view.open = null;
  }

  function pick(mac) {
    const d = routerDevice(mac);
    if (!d) return;
    const hidden = new Set(d.macs);
    cfg.exclude = (cfg.exclude || []).filter((m) => !hidden.has(norm(m)));
    cfg.devices = (Array.isArray(cfg.devices) ? cfg.devices : []).concat([{ name: homeName(d.name) || d.macs[0], macs: d.macs.slice() }]);
  }

  root.addEventListener('click', (event) => {
    const el = event.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;
    const item = current[Number(el.dataset.i)];
    const k = Number(el.dataset.k);
    if (act === 'connect') { connect(); return; }
    if (act === 'fix') { toggleFixed(el.dataset.mac); return; }
    if (act === 'fixed-open') { view.fixed = !view.fixed; Object.assign(fixedBox, { confirm: false, note: '', error: '' }); render(); return; }
    if (act === 'fixed-all') { fixedBox.all = !fixedBox.all; render(); return; }
    if (act === 'fixed-release') { releaseFixed([el.dataset.mac]); return; }
    if (act === 'fixed-stale') {
      if (!fixedBox.confirm) { Object.assign(fixedBox, { confirm: true, note: '', error: '' }); render(); return; } // first tap only asks
      releaseFixed(fixedRows().filter((r) => r.state !== 'online').map((r) => r.mac));
      return;
    }
    if (act === 'clean-open') { view.clean = !view.clean; clean.confirm = false; render(); return; }
    if (act === 'clean-all' || act === 'clean-none') {
      const all = staleDevices(new Set(current.flatMap((x) => x.macs)));
      clean.picked = new Set(act === 'clean-all' ? all.map((d) => d.id) : []);
      clean.confirm = false;
      render();
      return;
    }
    if (act === 'clean-run') {
      if (!clean.confirm) { clean.confirm = true; clean.message = ''; clean.error = ''; render(); return; } // first tap only asks
      runClean();
      return;
    }
    if (act === 'more') { view.limit += PAGE; render(); return; }
    if (act === 'options') { view.options = !view.options; render(); return; }
    if (!item) return;
    if (act === 'open') { view.open = view.open === item.macs[0] ? null : item.macs[0]; render(); return; }
    if (act === 'remove') { removeItem(item); push(); render(); return; }
    const device = own(item);
    if (act === 'sched-add') {
      const list = Array.isArray(device.schedules) ? device.schedules : (device.schedules = []);
      list.push(list.length ? { id: newId(), name: `${t('schedule')} ${list.length + 1}`, start: '14:00', end: '16:00' }
        : { id: newId(), name: t('night'), start: '22:00', end: '06:00' });
    } else if (act === 'sched-remove') {
      device.schedules.splice(k, 1);
    } else if (act === 'sched-day') {
      const s = device.schedules[k];
      const days = new Set(Array.isArray(s.days) && s.days.length ? s.days : DAYS);
      if (days.has(el.dataset.day)) days.delete(el.dataset.day); else days.add(el.dataset.day);
      if (!days.size) return; // at least one day
      if (days.size === 7) delete s.days; else s.days = DAYS.filter((d) => days.has(d));
    }
    push(); render();
  });

  // Typing: update the settings without redrawing, so the keyboard stays open.
  root.addEventListener('input', (event) => {
    const el = event.target.closest('[data-in]');
    if (!el) return;
    const kind = el.dataset.in;
    if (kind === 'search') {
      view.search = el.value; view.limit = PAGE;
      const holder = document.createElement('div');
      holder.innerHTML = renderNetwork(new Set(current.flatMap((item) => item.macs)));
      const fresh = holder.querySelector('#lv-net-wrap');
      const old = root.querySelector('#lv-net-wrap');
      if (fresh && old) old.replaceWith(fresh);
      return;
    }
    if (kind === 'host' || kind === 'password') { cfg[kind] = el.value; push(); return; }
    if (kind === 'group-name') { if (el.value.trim()) cfg.groupName = el.value; else delete cfg.groupName; push(); return; }
    if (kind === 'label') { cfg.labels = cfg.labels || {}; cfg.labels[el.dataset.key] = el.value; push(); return; }
    if (kind === 'opt-num') { const n = parseInt(el.value, 10); if (Number.isFinite(n)) cfg[el.dataset.key] = n; else delete cfg[el.dataset.key]; push(); return; }
    const item = current[Number(el.dataset.i)];
    if (!item) return;
    if (kind === 'macs') {
      const macs = [...new Set(el.value.split(/[\s,;]+/).map(norm).filter(Boolean))];
      if (!macs.length) return; // keep the last valid list while the user is typing
      const device = own(item);
      device.macs = macs;
      item.macs = macs;
      view.open = macs[0];
    } else if (kind === 'name') {
      own(item).name = el.value;
    } else if (kind === 'sched-name') {
      own(item).schedules[Number(el.dataset.k)].name = el.value;
    }
    push();
  });

  root.addEventListener('change', (event) => {
    const el = event.target.closest('[data-ch]');
    if (!el) return;
    const kind = el.dataset.ch;
    if (kind === 'layout') { if (el.value === 'single') cfg.grouping = 'single'; else delete cfg.grouping; push(); render(); return; }
    if (kind === 'language') {
      lang = el.value === 'he' ? 'he' : 'en';
      if (lang === 'he') cfg.language = 'he'; else delete cfg.language;
      push(); render();
      return;
    }
    if (kind === 'rename') { rename(el); return; }
    if (kind === 'clean-pick') {
      const all = staleDevices(new Set(current.flatMap((x) => x.macs)));
      if (!clean.picked) clean.picked = new Set(all.filter((d) => !d.custom).map((d) => d.id));
      if (el.checked) clean.picked.add(el.dataset.id); else clean.picked.delete(el.dataset.id);
      clean.confirm = false;
      const scroll = root.querySelector('#lv-clean-list');
      const top = scroll ? scroll.scrollTop : 0;
      render();
      const again = root.querySelector('#lv-clean-list');
      if (again) again.scrollTop = top; // keep the place in the list
      return;
    }
    if (kind === 'rename-mode') { view.rename = el.checked; view.limit = PAGE; render(); return; }
    if (kind === 'only-online') { view.onlyOnline = el.checked; view.limit = PAGE; render(); return; }
    if (kind === 'pick') {
      const d = routerDevice(el.dataset.mac);
      const item = d && current.find((x) => x.macs.some((m) => d.macs.includes(m)));
      if (el.checked && !item) pick(el.dataset.mac);
      else if (!el.checked && item) removeItem(item);
      push(); render();
      return;
    }
    if (kind === 'opt-bool') { cfg[el.dataset.key] = el.checked; push(); render(); return; }
    if (kind === 'opt') { cfg[el.dataset.key] = el.value; push(); return; }
    const item = current[Number(el.dataset.i)];
    if (!item) return;
    const device = own(item);
    if (kind === 'flag') {
      device[el.dataset.key] = el.checked;
    } else if (kind === 'sched-start' || kind === 'sched-end') {
      device.schedules[Number(el.dataset.k)][kind === 'sched-start' ? 'start' : 'end'] = el.value;
    }
    push(); render();
  });

  // Enter in a name field saves it and jumps to the next one.
  root.addEventListener('keydown', (event) => {
    if (event.key !== 'Enter' || !event.target.matches('[data-ch="rename"]')) return;
    event.preventDefault();
    const fields = [...root.querySelectorAll('[data-ch="rename"]:not([disabled])')];
    const next = fields[fields.indexOf(event.target) + 1];
    if (next) next.focus(); else event.target.blur();
  });

  // -------------------------------------------------------------------- start

  (async () => {
    try {
      const blocks = await hb.getPluginConfig();
      if (Array.isArray(blocks) && blocks.length) cfg = blocks[0];
      else { push(); }
    } catch (e) { /* start with an empty configuration */ }
    lang = cfg.language === 'he' ? 'he' : 'en'; // English unless Hebrew was chosen on this screen
    render();
    if (cfg.host && cfg.password) connect();
  })();
})();
</script>
